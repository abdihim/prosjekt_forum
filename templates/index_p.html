<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Registreringsskjema</title>
</head>
<body>
    <h2>Send data til database med Python</h2>

    <!-- Koblet til Flask-ruten i Python -->
    <form action="/send" method="POST">
        Navn: <input type="text" name="navn" required><br><br>

        E-post: <input type="email" name="epost" required><br><br>

        Melding:
        <textarea name="melding" rows="4" required></textarea><br><br>

        <input type="submit" value="Send inn">
    </form>

</body>
</html>
