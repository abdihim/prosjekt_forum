<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meld feil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <span class="logo">Forum</span>
    <div>
        <a href="/users">Brukere</a>
        <a href="/meld_feil">Meld feil</a>
        <a href="/login">Logg inn</a>
    </div>
</nav>
<main>
    <h1>Meld feil</h1>
    <p>Fant du noe som ikke fungerer? Si ifra!</p>
    <div class="card">
        <form method="POST">
            <label>Navn</label>
            <input type="text" name="navn" placeholder="Ditt navn" required>
            <label>E-post</label>
            <input type="email" name="epost" placeholder="din@epost.no" required>
            <label>Beskrivelse</label>
            <textarea name="melding" rows="4" placeholder="Hva skjedde?" required></textarea>
            <button type="submit" class="btn">Send inn</button>
        </form>
    </div>
</main>
<footer>Flask + MariaDB // Raspberry Pi</footer>
</body>
</html>
